#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
version: "1.0"

# Specify inspection profile for code analysis
profile:
  name: qodana.starter

# Use JavaScript/TypeScript linter for Vue 3 project
linter: jetbrains/qodana-js:2023.3

# Use baseline for known false positives
baseline:
  path: qodana-baseline.sarif
  includeAbsent: false

# Disable inspections that cause false positives with Vue 3 Composition API
exclude:
  # Vue 3 Composition API imports are compiler macros
  - name: TypeScriptCheckImport
    paths:
      - src/**/*.vue
  - name: TypeScriptUnresolvedReference
    paths:
      - src/**/*.vue
  
  # Vue 3 compiler macros don't need to be imported
  - name: ES6UnusedImports
    paths:
      - src/**/*.vue
  
  # Short imports are project preference
  - name: ES6PreferShortImport
  
  # RegExp escapes might be intentional
  - name: RegExpRedundantEscape
  
  # Allow some unused local symbols in tests
  - name: JSUnusedLocalSymbols
    paths:
      - test/**/*.ts
      - test/**/*.spec.ts
  
  # Scripts directory contains build tools
  - name: All
    paths:
      - scripts/
      - config/scripts/
      - test/mocks/
      - test/setup.ts
      - dist/
      - node_modules/
      - .qodana/
      - test-output/

# Include specific inspections for code quality
include:
  - name: JSPotentiallyInvalidUsageOfThis
  - name: JSValidateTypes
  - name: TypeScriptValidateTypes
  - name: TypeScriptExplicitMemberType

# Project-specific settings
bootstrap: |
  npm install --prefer-offline --no-audit

# Code coverage settings
coverage:
  threshold: 80
  
# Fail threshold - fail if more than 50 problems
failThreshold: 50

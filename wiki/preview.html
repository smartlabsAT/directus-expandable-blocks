<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Preview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-light.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #f6f8fa;
            border-right: 1px solid #e1e4e8;
            padding: 20px;
            overflow-y: auto;
        }
        .content {
            flex: 1;
            padding: 20px 40px;
            overflow-y: auto;
        }
        .markdown-body {
            max-width: 980px;
            margin: 0 auto;
        }
        .sidebar a {
            display: block;
            padding: 5px 10px;
            color: #0969da;
            text-decoration: none;
            border-radius: 4px;
        }
        .sidebar a:hover {
            background: #eaeef2;
        }
        .sidebar h3 {
            margin: 20px 0 10px 0;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Wiki Navigation</h2>
            <h3>Getting Started</h3>
            <a href="#" onclick="loadPage('01-Home.md')">Home</a>
            <a href="#" onclick="loadPage('02-Installation.md')">Installation</a>
            <a href="#" onclick="loadPage('03-Configuration.md')">Configuration</a>
            
            <h3>Documentation</h3>
            <a href="#" onclick="loadPage('04-Architecture-Overview.md')">Architecture Overview</a>
            <a href="#" onclick="loadPage('05-Data-Flow.md')">Data Flow</a>
            <a href="#" onclick="loadPage('06-API-Integration.md')">API Integration</a>
            <a href="#" onclick="loadPage('07-Development.md')">Development</a>
            
            <h3>Resources</h3>
            <a href="#" onclick="loadPage('08-Examples.md')">Examples</a>
            <a href="#" onclick="loadPage('09-Contributing.md')">Contributing</a>
            <a href="#" onclick="loadPage('10-Roadmap.md')">Roadmap</a>
            <a href="#" onclick="loadPage('11-Changelog.md')">Changelog</a>
        </div>
        <div class="content">
            <div id="markdown-content" class="markdown-body"></div>
        </div>
    </div>
    
    <script>
        async function loadPage(filename) {
            try {
                const response = await fetch(filename);
                const text = await response.text();
                
                // Convert wiki links [[Title|file]] to regular markdown links
                const processedText = text.replace(/\[\[([^\|]+)\|([^\]]+)\]\]/g, '[$1]($2.md)');
                
                document.getElementById('markdown-content').innerHTML = marked.parse(processedText);
            } catch (error) {
                document.getElementById('markdown-content').innerHTML = '<p>Error loading page: ' + error + '</p>';
            }
        }
        
        // Load home page by default
        loadPage('01-Home.md');
    </script>
</body>
</html>
